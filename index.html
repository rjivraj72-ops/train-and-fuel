<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Train & Fuel</title>
<meta name="theme-color" content="#0f1413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train & Fuel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one phone-width column, sticky date header, fixed bottom tab bar, bottom sheets for every form. Dark-first. */
:root{
  --bg:#0f1413; --surface:#171e1c; --surface-2:#202a27; --line:#2b3733;
  --fg:#eef2ef; --muted:#93a39e; --faint:#5f6e69;
  --accent:#ff6a3d; --accent-ink:#1c0b05; --accent-soft:rgba(255,106,61,.14);
  --good:#3ecf9a; --good-soft:rgba(62,207,154,.14);
  --warn:#f2b84b; --warn-soft:rgba(242,184,75,.15);
  --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.14);
  --cool:#7fa8c9; --cool-soft:rgba(127,168,201,.15);
  --t-str:#ff6a3d; --t-run:#f2b84b; --t-mob:#8fa1b4; --t-cross:#3ecf9a;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e8eeeb; --line:#d4ddd9;
  --fg:#13201b; --muted:#56675f; --faint:#8a9893;
  --accent:#dc4a18; --accent-ink:#ffffff; --accent-soft:rgba(220,74,24,.10);
  --good:#0f8f63; --good-soft:rgba(15,143,99,.11);
  --warn:#a86d0c; --warn-soft:rgba(168,109,12,.12);
  --bad:#c83434; --bad-soft:rgba(200,52,52,.10);
  --cool:#3f6f93; --cool-soft:rgba(63,111,147,.11);
  --t-str:#dc4a18; --t-run:#c58a12; --t-mob:#6c7f93; --t-cross:#0f8f63;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e8eeeb; --line:#d4ddd9;
  --fg:#13201b; --muted:#56675f; --faint:#8a9893;
  --accent:#dc4a18; --accent-ink:#ffffff; --accent-soft:rgba(220,74,24,.10);
  --good:#0f8f63; --good-soft:rgba(15,143,99,.11);
  --warn:#a86d0c; --warn-soft:rgba(168,109,12,.12);
  --bad:#c83434; --bad-soft:rgba(200,52,52,.10);
  --cool:#3f6f93; --cool-soft:rgba(63,111,147,.11);
  --t-str:#dc4a18; --t-run:#c58a12; --t-mob:#6c7f93; --t-cross:#0f8f63;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{white-space:nowrap;font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:21px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent);font-weight:800}
.top .sp{flex:1}
.datenav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.datenav button{background:none;border:0;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.datenav button:hover{background:var(--surface-2);color:var(--fg)}
.datenav .d{font-size:13px;font-weight:700;padding-inline:4px;min-width:84px;text-align:center;white-space:nowrap}
.iconbtn{background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--fg)}

/* sections */
.view{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:22px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.big{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:56px;line-height:.92;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:4px}
.mid{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.mid small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:700;margin-left:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*{min-width:0}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* meters */
.meter{position:relative;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.meter .band{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.meter .fill.good{background:var(--good)} .meter .fill.warn{background:var(--warn)} .meter .fill.bad{background:var(--bad)} .meter .fill.cool{background:var(--cool)}
.macro{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding-block:12px;border-top:1px solid var(--line)}
.macro:first-of-type{border-top:0}
.macro .nm{font-weight:700}
.macro .rg{color:var(--muted);font-size:12px}
.macro .v{grid-row:1/3;grid-column:2;text-align:right;display:flex;align-items:center;gap:8px}
.macro .meter{grid-column:1/-1}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.cool{background:var(--cool-soft);color:var(--cool)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 14px;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.line{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

/* hydration */
.tube{width:34px;height:96px;border:2px solid var(--cool);border-radius:12px;position:relative;overflow:hidden;flex:none}
.tube i{position:absolute;left:0;right:0;bottom:0;background:var(--cool);opacity:.85;transition:height .3s}
@media (prefers-reduced-motion:reduce){.tube i{transition:none}}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding-block:12px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.item .n{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.item .k{text-align:right;font-family:var(--f-mono);font-weight:600}
.item .k small{display:block;font-size:10px;color:var(--muted);font-weight:500}
button.item:hover .n{color:var(--accent)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}

/* week plan */
.plan{display:flex;flex-direction:column}
.pday{display:grid;grid-template-columns:4px 46px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.pday:first-child{border-top:0}
.pday .bar{align-self:stretch;border-radius:4px;background:var(--line)}
.pday.done .bar{background:var(--good)} .pday.today .bar{background:var(--accent)} .pday.miss .bar{background:var(--bad)}
.pday .dw{font-weight:700;font-size:14px;line-height:1.1}.pday .dw span{display:block;font-size:11px;color:var(--muted);font-weight:400}
.pday .ti{font-weight:700;min-width:0}.pday .de{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pday .ti, .pday>div:nth-child(3){min-width:0}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.weekdots div{text-align:center;font-size:11px;color:var(--muted)}
.weekdots i{display:block;height:8px;border-radius:4px;background:var(--surface-2);margin-bottom:4px}
.weekdots .done i{background:var(--good)} .weekdots .today i{background:var(--accent)} .weekdots .miss i{background:var(--bad-soft)} .weekdots .rest i{background:var(--line)}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats>div{min-width:0}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-mono)}
.balance .ln{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.balance .ln .meter{margin:0}

/* charts */
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.02em}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet h3{font-family:var(--f-display);font-stretch:80%;font-size:24px;margin:0;font-weight:800}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.form>*{min-width:0}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 4}
.f.h{grid-column:span 2}.f.q{grid-column:span 1}
@media (max-width:400px){.f.q{grid-column:span 2}}
.f label{font-size:12px;color:var(--muted);font-weight:700}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--muted)}
.aibox{grid-column:span 4;background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.aibox .row input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.filebtn{position:relative;cursor:pointer;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.planedit{grid-column:span 4;display:grid;grid-template-columns:40px 1fr 1fr 96px;gap:6px;align-items:center}
.planedit>*{min-width:0}
.planedit input,.planedit select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;width:100%}

/* coach */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.think{color:var(--muted);font-style:italic}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts span{font-size:11px;font-weight:700;background:var(--good-soft);color:var(--good);border-radius:999px;padding:3px 8px;white-space:normal}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;max-height:140px;min-height:46px}
/* iOS: 16px inputs stop Safari zooming on focus; keyboard mode hides the tab bar and pins the composer */
input,select,textarea{font-size:16px!important}
body.kb .tabs{display:none}
body.kb .app{padding-bottom:8px}
body.kb .composer{bottom:0}
.composer{z-index:4}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;max-width:240px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.mwrap{display:flex;flex-direction:column;gap:2px}
.mwrap.u{align-items:flex-end}.mwrap.a{align-items:flex-start}
.mwrap .msg{max-width:88%}
.mact{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.rx{background:none;border:1px solid transparent;border-radius:999px;font-size:15px;line-height:1;padding:4px 6px;opacity:.55;filter:grayscale(.6)}
.rx:hover,.rx:focus-visible{opacity:1;filter:none}
.rx.on{opacity:1;filter:none;background:var(--surface-2);border-color:var(--line)}
.msg{position:relative}
.rxbadge{position:absolute;right:-8px;bottom:-10px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;font-size:13px;padding:2px 5px;line-height:1}
.replybtn{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:2px 6px}
.replybtn:hover,.replybtn:focus-visible{color:var(--accent)}
.quote{border-left:3px solid currentColor;opacity:.75;padding-left:8px;margin-bottom:6px;font-size:13px}
.replybar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:8px 10px}
.replybar .rq{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knows summary,.checkin summary{cursor:pointer;font-weight:700}
.micbtn{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 0 0 0 var(--accent-soft);transition:box-shadow .3s}
.micbtn.live{background:var(--good);box-shadow:0 0 0 8px var(--good-soft)}
.micbtn.live.speaking{box-shadow:0 0 0 14px var(--good-soft)}
@media (prefers-reduced-motion:reduce){.micbtn{transition:none}}
.qp{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.qp button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap}
.qp button:hover{border-color:var(--accent)}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;text-align:left}
.sugg button:hover{border-color:var(--accent)}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.score{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:6px solid var(--accent);flex:none;text-align:center;line-height:1}
.score b{font-family:var(--f-display);font-stretch:70%;font-size:30px;font-weight:800}
.score span{display:block;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Train <b>&amp;</b> Fuel</div>
    <div class="sp"></div>
    <div class="datenav" id="datenav">
      <button id="prevDay" aria-label="Previous day"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="d" id="dateLabel" aria-label="Jump to today">Today</button>
      <button id="nextDay" aria-label="Next day"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Targets and routine"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div id="status"></div>
  <input type="file" id="photoIn" accept="image/*" multiple hidden>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Today</a>

function chartWeight(pts,lo,hi){
  if(!pts.length)return`<div class="empty">No weigh-ins yet. Add your first one above.</div>`;
  const W=340,h=170,top=16,bot=22,left=34,right=40,iw=W-left-right,ih=h-top-bot;
  const t=pts.map(p=>parse(p.date).getTime());const t0=Math.min(...t),t1=Math.max(...t)||t0+1;
  const vs=pts.map(p=>+p.lb);const mn=Math.floor(Math.min(lo,...vs)-1),mx=Math.ceil(Math.max(hi,...vs)+1);
  const x=tt=>left+(t1===t0?iw/2:(tt-t0)/(t1-t0)*iw),y=v=>top+ih-(v-mn)/(mx-mn)*ih;
  let s=`<rect x="${left}" y="${y(hi)}" width="${iw}" height="${y(lo)-y(hi)}" fill="var(--good-soft)"/>`;
  for(const v of[mn,lo,hi,mx])s+=`<line class="grid" x1="${left}" x2="${left+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${left-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  s+=`<text x="${left+iw+4}" y="${(y(hi)+y(lo))/2+3}" style="fill:var(--good)">target</text>`;
  s+=`<path d="${pts.map((p,i)=>(i?"L":"M")+x(t[i]).toFixed(1)+" "+y(+p.lb).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${x(t[i])}" cy="${y(+p.lb)}" r="${last?5:3.2}" fill="${last?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`;
    if(last||i===0)s+=`<text x="${x(t[i])}" y="${y(+p.lb)-9}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${n1(p.lb)}</text>`;
    const every=Math.ceil(pts.length/6);if(i%every===0||last)s+=`<text x="${x(t[i])}" y="${h-6}" text-anchor="middle">${short(p.date)}</text>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Weight trend">${s}</svg>`;
}

TARGETS: ${s.kcal} kcal/day (±200 counts as on target); protein ${s.proteinMin}-${s.proteinMax} g; fat ${s.fatMin}-${s.fatMax} g; carbs ${cLo}-${cHi} g; water ${s.waterMl} ml; weight range ${s.weightLo}-${s.weightHi} lb. Kitchen open ${fmtT(s.open)}-${fmtT(s.close)}. Flex day: ${DOW[s.flexDow]} (no calorie flag, not scored).
${(s.about||s.profile)?"ABOUT THEM (in their words):\n"+(s.about||s.profile)+"\n":""}${s.coachStyle?"THEIR COACHING STYLE INSTRUCTIONS (follow these): "+s.coachStyle+"\n":""}${notes().length?"LEARNED IN PAST CHATS:\n"+notes().map(n=>"- "+n.text).join("\n")+"\n":""}

THIS WEEK'S ROUTINE:
${wk}
WEEKLY SCORE so far: ${sc.score??"n/a"} (calories on target ${sc.cal}/${sc.counted} days, protein ${sc.pro}/${sc.counted}, sessions ${sc.done}/${sc.planned}).

${recent.join("\n")}

}

  convMode=mode;convStatus="connecting";updateMic();
  const opts={agentId:AGENT_ID,connectionType:mode==="voice"?"webrtc":"websocket",dynamicVariables:{context:buildContext()},clientTools:clientTools(),
    onMessage:m=>{const role=m.role||(m.source==="ai"?"agent":"user");if(!m.message)return;if(role==="user"){if(convMode==="voice")addTurn("user",m.message);return}awaiting=false;addTurn("assistant",m.message);touchIdle()},
    onModeChange:({mode:md})=>{agentSpeaking=md==="speaking";updateMic()},
    onStatusChange:({status})=>{convStatus=status;updateMic()},
    onDisconnect:()=>{conv=null;convMode=null;convStatus="disconnected";agentSpeaking=false;awaiting=false;clearTimeout(idleTimer);updateMic();renderChat()},
    onError:msg=>{console.warn("coach error",msg);if(convMode==="voice")toast("Voice error: "+String(msg).slice(0,80))}};

function addTurn(role,content){chatTurns=chatTurns||[];const t={role,content:String(content),at:Date.now()};if(role==="assistant"&&pendingActions.length)t.actions=pendingActions.splice(0);chatTurns.push(t);saveChatSoon();renderChat()}
function saveChatSoon(){clearTimeout(saveChatT);saveChatT=setTimeout(()=>{chatTurns=(chatTurns||[]).slice(-60);store.set("chat","log",{turns:chatTurns.map(({img,imgs,...r})=>r)})},1500)}
async function saveChat(){chatTurns=(chatTurns||[]).slice(-60);await store.set("chat","log",{turns:chatTurns.map(({img,imgs,...r})=>r)})}
function snippet(s){s=String(s).replace(/\s+/g," ").trim();return s.length>140?s.slice(0,137)+"…":s}
function setReply(i){const t=(chatTurns||[])[i];if(!t){replyTarget=null}else replyTarget={text:snippet(t.content),role:t.role};const rb=$("#replyBar");if(!rb)return;
  if(!replyTarget){rb.hidden=true;rb.innerHTML="";return}
  rb.hidden=false;rb.innerHTML=`<div style="min-width:0"><div class="eyebrow">Replying to ${replyTarget.role==="user"?"yourself":"Coach"}</div><div class="small muted rq">${esc(replyTarget.text)}</div></div><button type="button" class="iconbtn" data-act="cancelReply" aria-label="Cancel reply">✕</button>`;
  const ta=$("#chatIn");ta&&ta.focus()}
async function sendText(text){
  const q=replyTarget;setReply(-1);
  addTurn("user",text);if(q)chatTurns[chatTurns.length-1].quote=q.text;awaiting=true;renderChat();
  const wire=q?`(Replying to ${q.role==="user"?"my":"your"} earlier message: "${q.text}")\n\n${text}`:text;
  try{const c=await startConv(convMode==="voice"?"voice":"text");c.sendUserMessage(wire);touchIdle()}
  catch(e){awaiting=false;addTurn("assistant","I couldn't connect just now ("+(e?.message||"connection failed")+"). Check your connection and try again.")}
}
async function toggleVoice(){
  if(convMode==="voice"){await endConv();return}
  try{await startConv("voice")}catch(e){convMode=null;convStatus="disconnected";updateMic();toast(/permission|NotAllowed/i.test(String(e?.message||e))?"Allow microphone access to talk to the Coach.":"Couldn't start voice. Check your connection.")}
}
async function shrinkImage(file){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.85))}catch{return file}
}
const photoAsk=n=>(n>1?"Here are "+n+" photos. Log each separate meal, drink or workout as its own entry. If several photos show the same thing (a plate and its label, two angles of one meal, two screens of one workout), combine them into one entry. ":"Here's a photo. ")+"If it's food or a drink, estimate what's in it and log it with log_meal. If it's a workout summary screenshot (Apple Watch, Peloton or similar), read it and log it with log_workout using the date and time shown (lb to kg, miles to km). Then confirm with the numbers, one line per entry. If you can't tell what something is, ask.";
let convFiles=0, replyTarget=null;
const REACTS=["👍","👎","❤️","💪","😂"];
async function sendPhotos(list){
  const files=[...list].slice(0,6);if(!files.length)return;
  if(list.length>6)toast("Sending the first 6 photos");
  if(location.hash!=="#coach")location.hash="coach";
  await new Promise(r=>setTimeout(r,60));
  const ta=$("#chatIn");const extra=ta&&ta.value.trim();if(ta)ta.value="";
  chatTurns=chatTurns||[];addTurn("user",(files.length>1?"["+files.length+" photos]":"[Photo]")+(extra?" "+extra:""));
  chatTurns[chatTurns.length-1].imgs=files.map(f=>URL.createObjectURL(f));
  awaiting=true;renderChat();
  try{
    if(conv&&convFiles+files.length>10)await endConv();
    const c=await startConv(convMode==="voice"?"voice":"text");
    const ids=[];for(const f of files){const blob=await shrinkImage(f);const {fileId}=await c.uploadFile(blob);ids.push(fileId);convFiles++}
    c.sendMultimodalMessage({text:extra?extra+"\n\n"+photoAsk(ids.length):photoAsk(ids.length),fileIds:ids});touchIdle();
  }catch(e){awaiting=false;addTurn("assistant","I couldn't send "+(files.length>1?"those photos":"that photo")+" ("+(e?.message||"upload failed")+"). Try again, or describe it in words.")}
}
document.addEventListener("change",e=>{if(e.target.id==="photoIn"&&e.target.files?.length)sendPhotos(e.target.files)});
function mdLite(s){return esc(s).replace(/^#{1,3} (.+)$/gm,"<b>$1</b>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^[-*] (.+)$/gm,"• $1")}
function checkinCard(compact){
  if(!checkin?.text)return"";
  if(compact){const d=checkin.date;if(!d||addDays(d,7)<todayStr())return""}
  return`<details class="card checkin" ${compact?"":"open"}><summary><span class="eyebrow">Weekly check-in${checkin.date?" · "+short(checkin.date):""}</span></summary><div class="small" style="white-space:pre-wrap;margin-top:10px;line-height:1.55">${mdLite(checkin.text)}</div></details>`;
}
function vCoach(){
  return`<div class="view"><div class="head"><div><div class="eyebrow">Coach</div><h2>Talk or type</h2><p class="sub" id="coachStatus">Tap the mic to talk. Typing works too.</p></div>
  <button type="button" class="micbtn" id="micBtn" aria-pressed="false" aria-label="Start voice conversation"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
  <div id="checkinSlot"></div>
  <details class="card knows"><summary>What the Coach knows about you</summary><div id="knowsBody"></div></details>
  <div class="chat" id="chatLog"></div>
  <div class="qp" id="qp"></div>
  <div id="replyBar" class="replybar" hidden></div>
  <form class="composer" id="composer"><button type="button" class="btn ghost" data-act="photo" aria-label="Log from a photo or screenshot" style="padding:10px 12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><textarea id="chatIn" rows="1" placeholder="What did you eat? Or ask…" aria-label="Message"></textarea><button class="btn" id="chatSend" type="submit">Send</button></form></div>`;
}
function renderChat(){
  const el=$("#chatLog");if(!el)return;
  const cs=$("#checkinSlot");if(cs)cs.innerHTML=checkinCard(false);
  const kb=$("#knowsBody");if(kb){const s=S(),ab=s.about||s.profile,ns=notes();
    kb.innerHTML=`<div class="eyebrow" style="margin-top:12px">About me</div><p class="small" style="white-space:pre-wrap;margin:6px 0 0">${ab?esc(ab):'<span class="muted">Nothing yet. Add your story so the Coach knows you.</span>'}</p>
    <div class="eyebrow" style="margin-top:14px">Learned in chats</div>${ns.length?`<div class="list">${ns.map((n,i)=>`<div class="item" style="grid-template-columns:1fr auto;padding-block:8px"><span class="small">${esc(n.text)}</span><button type="button" class="btn sm ghost" data-act="forgetNote" data-i="${i}">Remove</button></div>`).join("")}</div>`:'<p class="small muted" style="margin:6px 0 0">When you mention lasting things (a goal, a food you avoid, an injury), the Coach saves them here.</p>'}
    <button type="button" class="btn sm line" data-act="settings" style="margin-top:12px">Edit About me</button>`}
  const qp=$("#qp");if(qp)qp.innerHTML=(S().quickPrompts||[]).map(x=>`<button type="button" data-sugg="${esc(x)}">${esc(x)}</button>`).join("");
  const turns=chatTurns||[];
  if(!turns.length&&!awaiting){el.innerHTML=`<div class="card"><h2>Ask about your day, or just tell me what you ate</h2><p class="sub">Try “two boiled eggs and GF toast at 8:30”, “drank a bottle of water”, or “did the 45 min upper body”. I'll log it and give you the numbers.</p></div>`;return}
  const base=Math.max(0,turns.length-40);
  el.innerHTML=turns.slice(-40).map((t,k)=>`<div class="mwrap ${t.role==="user"?"u":"a"}"><div class="msg ${t.role==="user"?"u":"a"}">${t.quote?`<div class="quote">${esc(t.quote)}</div>`:""}${t.react?`<span class="rxbadge">${t.react}</span>`:""}${md(t.content)}${(t.imgs||(t.img?[t.img]:[])).length?`<div class="thumbs">${(t.imgs||[t.img]).map(u=>`<img src="${u}" alt="Photo you sent">`).join("")}</div>`:""}${t.actions?.length?`<div class="acts">${t.actions.map(a=>`<span>✓ ${esc(a)}</span>`).join("")}</div>`:""}</div><div class="mact"><button type="button" class="replybtn" data-act="replyTo" data-i="${base+k}" aria-label="Reply to this message">Reply</button>${t.role!=="user"?REACTS.map(e=>`<button type="button" class="rx${t.react===e?" on":""}" data-act="react" data-i="${base+k}" data-e="${e}" aria-label="React ${e}" aria-pressed="${t.react===e}">${e}</button>`).join(""):""}</div></div>`).join("")
    +(awaiting?`<div class="msg a think">Thinking…</div>`:"")
    +(turns.length?`<button type="button" class="btn sm ghost" data-act="clearChat" style="align-self:center">Clear conversation</button>`:"");
  const all=el.querySelectorAll(".msg");all.length&&all[all.length-1].scrollIntoView({block:"nearest"});
}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function bindComposer(){
  const f=$("#composer"),ta=$("#chatIn");
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(140,ta.scrollHeight)+"px"});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();f.requestSubmit()}});
  f.onsubmit=e=>{e.preventDefault();const v=ta.value.trim();if(!v)return;ta.value="";ta.style.height="auto";sendText(v)};
  $("#micBtn").onclick=toggleVoice;updateMic();
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const sg=e.target.closest("[data-sugg]");if(sg){sendChat(sg.dataset.sugg);return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="addMeal")mealSheet();
  else if(a==="editMeal")mealSheet({id,...col.meals[id]});
  else if(a==="addWorkout")workoutSheet();
  else if(a==="editWorkout")workoutSheet({id,...col.workouts[id]});
  else if(a==="addWeight")weightSheet();
  else if(a==="settings")settingsSheet();
  else if(a==="addSaved")savedSheet();
  else if(a==="editSaved")savedSheet({id,...col.saved[id]});
  else if(a==="logSaved"){const m=col.saved[id];b.disabled=true;await safe(store.add("meals",{name:m.name,kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,date,time:date===todayStr()?nowHM():"12:00",created:Date.now()}),"Logged "+m.name);b.disabled=false}
  else if(a==="moveSaved"){const sv=savedList();const i=sv.findIndex(x=>x.id===id),j=i+(+b.dataset.dir);if(j<0||j>=sv.length)return;
    const A=sv[i],B=sv[j];const{id:ia,...da}=A,{id:ib,...dbb}=B;const oa=i,ob=j;await safe(store.set("saved",ia,{...da,order:ob}));await safe(store.set("saved",ib,{...dbb,order:oa}));
    sv.forEach((x,k)=>{if(k!==i&&k!==j&&x.order!==k){const{id:ix,...dx}=x;store.set("saved",ix,{...dx,order:k}).catch(()=>{})}})}
  else if(a==="water"){const ml=+b.dataset.ml;const cur=waterOn(date);waterUndo.push({d:date,ml});await safe(store.set("water",date,{ml:cur+ml}))}
  else if(a==="waterUndo"){const u=waterUndo.pop();if(!u)return;await safe(store.set("water",u.d,{ml:Math.max(0,waterOn(u.d)-u.ml)}),"Undone")}
  else if(a==="skipImport"){needsImport=false;render()}
  else if(a==="photo"){closeSheet();const pi=$("#photoIn");pi.value="";pi.click()}
  else if(a==="replyTo"){setReply(+b.dataset.i)}
  else if(a==="react"){const t=chatTurns&&chatTurns[+b.dataset.i];if(t){t.react=t.react===b.dataset.e?undefined:b.dataset.e;if(!t.react)delete t.react;saveChatSoon();renderChat()}}
  else if(a==="cancelReply"){setReply(-1)}
  else if(a==="retrySync"){setSync("saving");flush()}
  else if(a==="retryLoad"){loadAll()}
  else if(a==="disconnect"){if(b.dataset.armed){try{localStorage.removeItem(CFG_KEY)}catch{};cfg=null;closeSheet();await endConv();COLS.forEach(c=>col[c]={});render()}else{b.dataset.armed="1";b.textContent="Tap again to disconnect"}}
  else if(a==="syncNow"){closeSheet();if(hasPending())flush();else{lastLoad=0;loadAll()}toast("Syncing")}
  else if(a==="forgetNote"){const list=notes().slice();list.splice(+b.dataset.i,1);await safe(store.set("settings","memory",{notes:list}),"Removed")}
  else if(a==="clearChat"){if(b.dataset.armed){chatTurns=[];await saveChat();renderChat()}else{b.dataset.armed="1";b.textContent="Tap again to clear"}}
});
$("#prevDay").onclick=()=>{date=addDays(date,-1);render()};
$("#nextDay").onclick=()=>{date=addDays(date,1);render()};
$("#dateLabel").onclick=()=>{date=todayStr();render()};
$("#settingsBtn").onclick=settingsSheet;
let toastT;function toast(m){document.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}
const VIEWS=["today","food","train","trends","coach"];
function route(){const h=location.hash.slice(1);const nv=VIEWS.includes(h)?h:"today";if(nv!==view){view=nv;$("#main").innerHTML="";window.scrollTo(0,0)}render()}
window.addEventListener("hashchange",route);
let lastDay=todayStr();setInterval(()=>{const t=todayStr();if(t!==lastDay){if(date===lastDay)date=t;lastDay=t}if(view==="today"&&!sheetEl)render()},60000);

/* ---------- keyboard handling (phones) ---------- */
(function(){
  const isField=el=>el&&(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&!["checkbox","radio","file","button","submit"].includes(el.type))||el.tagName==="SELECT");
  const vv=window.visualViewport;
  function update(){
    const open=isField(document.activeElement)&&(!vv||window.innerHeight-vv.height>120||matchMedia("(pointer:coarse)").matches);
    document.body.classList.toggle("kb",!!open);
  }
  document.addEventListener("focusin",e=>{if(isField(e.target)){update();if(e.target.id==="chatIn")setTimeout(()=>e.target.scrollIntoView({block:"end"}),250)}});
  document.addEventListener("focusout",()=>setTimeout(update,80));
  vv&&vv.addEventListener("resize",update);
})();
/* ---------- boot ---------- */
const BUILD="2026-11-03h";
(async()=>{try{const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/const BUILD="([^"]+)"/);
  if(m&&m[1]!==BUILD){const u=new URL(location.href);if(u.searchParams.get("v")!==m[1]){u.searchParams.set("v",m[1]);location.replace(u.toString())}}}catch{}})();
route();setStatus();if(cfg)loadAll();
</script>
