<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Train & Fuel</title>
<meta name="theme-color" content="#0f1413" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train & Fuel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one phone-width column, sticky date header, fixed bottom tab bar, bottom sheets for every form. Dark-first. */
:root{
  --bg:#0f1413; --surface:#171e1c; --surface-2:#202a27; --line:#2b3733;
  --fg:#eef2ef; --muted:#93a39e; --faint:#5f6e69;
  --accent:#ff6a3d; --accent-ink:#1c0b05; --accent-soft:rgba(255,106,61,.14);
  --good:#3ecf9a; --good-soft:rgba(62,207,154,.14);
  --warn:#f2b84b; --warn-soft:rgba(242,184,75,.15);
  --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.14);
  --cool:#7fa8c9; --cool-soft:rgba(127,168,201,.15);
  --t-str:#ff6a3d; --t-run:#f2b84b; --t-mob:#8fa1b4; --t-cross:#3ecf9a;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e8eeeb; --line:#d4ddd9;
  --fg:#13201b; --muted:#56675f; --faint:#8a9893;
  --accent:#dc4a18; --accent-ink:#ffffff; --accent-soft:rgba(220,74,24,.10);
  --good:#0f8f63; --good-soft:rgba(15,143,99,.11);
  --warn:#a86d0c; --warn-soft:rgba(168,109,12,.12);
  --bad:#c83434; --bad-soft:rgba(200,52,52,.10);
  --cool:#3f6f93; --cool-soft:rgba(63,111,147,.11);
  --t-str:#dc4a18; --t-run:#c58a12; --t-mob:#6c7f93; --t-cross:#0f8f63;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#e8eeeb; --line:#d4ddd9;
  --fg:#13201b; --muted:#56675f; --faint:#8a9893;
  --accent:#dc4a18; --accent-ink:#ffffff; --accent-soft:rgba(220,74,24,.10);
  --good:#0f8f63; --good-soft:rgba(15,143,99,.11);
  --warn:#a86d0c; --warn-soft:rgba(168,109,12,.12);
  --bad:#c83434; --bad-soft:rgba(200,52,52,.10);
  --cool:#3f6f93; --cool-soft:rgba(63,111,147,.11);
  --t-str:#dc4a18; --t-run:#c58a12; --t-mob:#6c7f93; --t-cross:#0f8f63;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{white-space:nowrap;font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:21px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent);font-weight:800}
.top .sp{flex:1}
.datenav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.datenav button{background:none;border:0;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.datenav button:hover{background:var(--surface-2);color:var(--fg)}
.datenav .d{font-size:13px;font-weight:700;padding-inline:4px;min-width:84px;text-align:center;white-space:nowrap}
.iconbtn{background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--fg)}

/* sections */
.view{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:22px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.big{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:56px;line-height:.92;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:4px}
.mid{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.mid small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:700;margin-left:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*{min-width:0}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* meters */
.meter{position:relative;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.meter .band{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.meter .fill.good{background:var(--good)} .meter .fill.warn{background:var(--warn)} .meter .fill.bad{background:var(--bad)} .meter .fill.cool{background:var(--cool)}
.macro{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding-block:12px;border-top:1px solid var(--line)}
.macro:first-of-type{border-top:0}
.macro .nm{font-weight:700}
.macro .rg{color:var(--muted);font-size:12px}
.macro .v{grid-row:1/3;grid-column:2;text-align:right;display:flex;align-items:center;gap:8px}
.macro .meter{grid-column:1/-1}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.cool{background:var(--cool-soft);color:var(--cool)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 14px;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.line{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

/* hydration */
.tube{width:34px;height:96px;border:2px solid var(--cool);border-radius:12px;position:relative;overflow:hidden;flex:none}
.tube i{position:absolute;left:0;right:0;bottom:0;background:var(--cool);opacity:.85;transition:height .3s}
@media (prefers-reduced-motion:reduce){.tube i{transition:none}}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding-block:12px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.item .n{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.item .k{text-align:right;font-family:var(--f-mono);font-weight:600}
.item .k small{display:block;font-size:10px;color:var(--muted);font-weight:500}
button.item:hover .n{color:var(--accent)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}

/* week plan */
.plan{display:flex;flex-direction:column}
.pday{display:grid;grid-template-columns:4px 46px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.pday:first-child{border-top:0}
.pday .bar{align-self:stretch;border-radius:4px;background:var(--line)}
.pday.done .bar{background:var(--good)} .pday.today .bar{background:var(--accent)} .pday.miss .bar{background:var(--bad)}
.pday .dw{font-weight:700;font-size:14px;line-height:1.1}.pday .dw span{display:block;font-size:11px;color:var(--muted);font-weight:400}
.pday .ti{font-weight:700;min-width:0}.pday .de{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pday .ti, .pday>div:nth-child(3){min-width:0}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.weekdots div{text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.weekdots i{display:block;height:10px;border-radius:5px;background:var(--surface-2);margin-bottom:5px}
.weekdots .done i.s{background:var(--good)} .weekdots .today i.s{background:var(--accent)} .weekdots .miss i.s{background:var(--bad-soft)} .weekdots .rest i.s{background:var(--line)}
.weekdots i.f.good{background:var(--good)} .weekdots i.f.part{background:var(--warn)} .weekdots i.f.bad{background:var(--bad)} .weekdots i.f.flex{background:transparent;border:2px dashed var(--line);box-sizing:border-box}
.weekkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.weekkey b{display:inline-block;width:14px;height:10px;border-radius:5px;margin-right:5px;vertical-align:middle}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats>div{min-width:0}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-mono)}
.balance .ln{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.balance .ln .meter{margin:0}

/* charts */
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.02em}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet h3{font-family:var(--f-display);font-stretch:80%;font-size:24px;margin:0;font-weight:800}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.form>*{min-width:0}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 4}
.f.h{grid-column:span 2}.f.q{grid-column:span 1}
@media (max-width:400px){.f.q{grid-column:span 2}}
.f label{font-size:12px;color:var(--muted);font-weight:700}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--muted)}
.aibox{grid-column:span 4;background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.aibox .row input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.filebtn{position:relative;cursor:pointer;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.planedit{grid-column:span 4;display:grid;grid-template-columns:40px 1fr 1fr 96px;gap:6px;align-items:center}
.planedit>*{min-width:0}
.planedit input,.planedit select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;width:100%}

/* coach */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.think{color:var(--muted);font-style:italic}
.estnote{background:#fff4d6!important;color:#3d2900!important;border:1.5px solid #d9a400}.estnote .eyebrow,.estnote .small{color:#3d2900!important}
@media (prefers-color-scheme:dark){.estnote{background:#3a2c00!important;color:#ffe08a!important}.estnote .eyebrow,.estnote .small{color:#ffe08a!important}}
.actbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:12px;padding:8px 12px;font:inherit;font-size:calc(var(--chat-fs,16px)*.8);font-weight:700;cursor:pointer;border:1.5px solid transparent}
.actbtn.ok{background:var(--good-soft);color:var(--good)}
.actbtn.est{background:#fff4d6;color:#5a3d00;border-color:#d9a400}
.actbtn .l2{font-weight:600}
.actbtn .l3{text-decoration:underline;font-weight:800}
@media (prefers-color-scheme:dark){.actbtn.est{background:#3a2c00;color:#ffe08a;border-color:#a37a00}}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts>span{font-size:11px;font-weight:700;background:var(--good-soft);color:var(--good);border-radius:999px;padding:3px 8px;white-space:normal}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;max-height:140px;min-height:46px}
/* iOS: 16px inputs stop Safari zooming on focus; keyboard mode hides the tab bar and pins the composer */
input,select,textarea{font-size:16px!important}
body.kb .tabs{display:none}
body.kb .app{padding-bottom:8px}
body.kb .composer{bottom:0}
.composer{z-index:4;flex-wrap:wrap}
.flags{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.flag{font-size:13px;padding:8px 10px;border-radius:10px;border-left:3px solid var(--warn);background:var(--warn-soft)}
.flag.concern{border-left-color:var(--bad);background:var(--bad-soft)}
.flag b{margin-right:4px}
.wbtns{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:12px}.wbtns .btn{min-height:48px;font-size:17px;font-weight:800;padding:0 6px}
.weighnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit}.weighnote .pill{margin-left:auto}
.rpt-open{display:block;width:100%;white-space:normal;line-height:1.25;margin-top:12px;padding:14px;font-size:17px;font-weight:800;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px}
.rpt{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rpt-bar{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rpt iframe{flex:1;width:100%;border:0;background:#fff}
.ig-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.ig-rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;flex:1;min-width:250px}
.ig-ring{display:flex;flex-direction:column;align-items:center;text-align:center}
.ig-rv{font-family:var(--f-mono);font-size:14px;font-weight:700;fill:var(--fg)}
.ig-rl{font-size:14px;font-weight:700;margin-top:2px;line-height:1.15}
.ig-rs{font-size:13px;color:var(--muted)}
.ig-d{font-size:13px;font-weight:700;margin-left:4px;white-space:nowrap}
.ig-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.ig-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;font-size:12px;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.ig-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.ig-day{position:relative;background:var(--surface-2);border-radius:8px;padding:4px 3px 7px;min-height:52px;display:flex;flex-direction:column;align-items:center;overflow:hidden;border:1.5px solid transparent}
.ig-day.blank{background:none}
.ig-day.good{background:var(--good-soft)} .ig-day.acc{background:var(--accent-soft)} .ig-day.cool{background:var(--cool-soft)}
.ig-day.fut{opacity:.4} .ig-day.today{border-color:var(--fg)}
.ig-dn{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.ig-dp{font-size:15px;font-weight:700;line-height:1.3;min-height:17px}
.ig-day.good .ig-dp{color:var(--good)} .ig-day.acc .ig-dp{color:var(--accent)} .ig-day.cool .ig-dp{color:var(--cool)}
.ig-dots{display:flex;gap:2px;align-items:center;min-height:9px;flex-wrap:wrap;justify-content:center}
.ig-dots i,.ig-leg i.miss{width:6px;height:6px;border-radius:50%;display:inline-block}
i.miss{background:none!important;border:1.5px solid var(--bad);box-sizing:border-box}
.ig-moon{font-size:12px;color:var(--warn);line-height:1}
.ig-cal{position:absolute;left:0;right:0;bottom:0;height:4px}
.ig-leg{font-size:13px;gap:10px}
.ig-leg b{color:var(--warn)}
.ig-pairs{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.ig-key{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.ig-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- state + store ---------- */
const COLS=["meals","workouts","weights","water","saved","settings","history","chat","patterns","health"];
const col={};COLS.forEach(c=>col[c]={});
let view="today", date=todayStr();
let chatTurns=null, chatBusy=false, chatCtl=null;
const waterUndo=[];

const S=()=>{const s={...DEFAULTS,...(col.settings.main||{})};if(!Array.isArray(s.plan)||s.plan.length!==7)s.plan=DEFAULT_PLAN;return s};
const H=()=>col.history.main||{};
const notes=()=>Array.isArray(col.settings.memory?.notes)?col.settings.memory.notes:[];
const mealsOn=d=>Object.entries(col.meals).map(([id,m])=>({id,...m})).filter(m=>m.date===d).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
const workoutsOn=d=>Object.entries(col.workouts).map(([id,w])=>({id,...w})).filter(w=>w.date===d).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
const allWorkouts=()=>Object.entries(col.workouts).map(([id,w])=>({id,...w})).sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
const weights=()=>Object.values(col.weights).filter(w=>w.date&&w.lb).sort((a,b)=>a.date.localeCompare(b.date));
const savedList=()=>Object.entries(col.saved).map(([id,m])=>({id,...m})).sort((a,b)=>(a.order??99)-(b.order??99));
function totals(d){const t={kcal:0,protein:0,carbs:0,fat:0,n:0};for(const m of mealsOn(d)){t.kcal+=+m.kcal||0;t.protein+=+m.protein||0;t.carbs+=+m.carbs||0;t.fat+=+m.fat||0;t.n++}return t}
const burnOn=d=>workoutsOn(d).reduce((s,w)=>s+(+w.kcal||0),0);
const waterOn=d=>+(col.water[d]?.ml)||0;
function waterPace(){const s=S(),n=hm2min(nowHM()),o=hm2min(s.open),c=hm2min(s.close);if(!(c>o))return null;const f=Math.max(0,Math.min(1,(n-o)/(c-o)));return Math.round(s.waterMl*f/50)*50}

/* ---------- GitHub storage ---------- */
const AGENT_ID="agent_7601m6j5ksxtfg59e823qjgjz6cc";
const DEFAULT_REPO="rjivraj72-ops/train-and-fuel-data";
const CFG_KEY="tf-github";
let cfg=null;try{cfg=JSON.parse(localStorage.getItem(CFG_KEY)||"null")}catch{}
const PROFILE_COLS=["settings","saved","history","weights"];
let checkin=null, nudge=null, lastLoad=0, syncState="idle", needsImport=false;
const loadedMonths=new Set();
function fileFor(c,id,data){
  if(PROFILE_COLS.includes(c))return"profile.json";
  if(c==="chat")return"chat.json";
  if(c==="patterns")return"patterns.json";
  const d=(c==="water"||c==="health")?id:(data?.date||col[c][id]?.date||todayStr());
  return"log/"+String(d).slice(0,7)+".json";
}
const enc=s=>{const b=new TextEncoder().encode(s);let out="";for(let i=0;i<b.length;i+=0x8000)out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(out)};
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function gh(path,opts={}){
  return fetch("https://api.github.com/repos/"+cfg.repo+(path?"/"+path:""),{cache:"no-store",...opts,headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opts.headers||{})}});
}
async function getRaw(path){
  const r=await gh("contents/"+path);
  if(r.status===404)return{sha:null,text:null};
  if(r.status===401||r.status===403)throw{code:"auth"};
  if(!r.ok)throw{code:"http",status:r.status};
  const j=await r.json();return{sha:j.sha,text:dec(j.content||"")};
}
async function getFile(path){const f=await getRaw(path);let data={};if(f.text)try{data=JSON.parse(f.text)}catch{data={}}return{sha:f.sha,data}}
async function putFile(path,data,sha,msg){

  if(r.status===401||r.status===403)throw{code:"auth"};

const pending={},inflight={};let flushing=false,flushTimer=null;

try{const saved=JSON.parse(localStorage.getItem(PEND_KEY)||"null");if(saved)for(const[p,ops]of Object.entries(saved))if(Array.isArray(ops)&&ops.length)(pending[p]=pending[p]||[]).push(...ops)}catch{}

async function flush(){
  if(flushing||!cfg)return;flushing=true;
  try{
    for(const p of Object.keys(pending)){
      const ops=pending[p];delete pending[p];if(!ops||!ops.length)continue;inflight[p]=ops;persistPending();

          const f=await getFile(p);const d=f.data||{};
          for(const o of ops){d[o.c]=d[o.c]||{};if(o.val==null)delete d[o.c][o.id];else d[o.c][o.id]=o.val}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const store={
  async set(c,id,data){
    const old=col[c][id];
    if(old&&old.date&&data&&data.date&&!PROFILE_COLS.includes(c)&&c!=="water"&&c!=="chat"&&old.date.slice(0,7)!==data.date.slice(0,7))queue(c,id,null);

async function safe(p,msg){try{await p;if(msg)toast(msg);return true}catch(e){toast("Couldn't save that. Try again.");return false}}
function monthsBack(n,from){const out=[];const d=from?parse(from):new Date();d.setDate(1);for(let i=0;i<n;i++){out.push(d.getFullYear()+"-"+pad(d.getMonth()+1));d.setMonth(d.getMonth()-1)}return out}

  for(const c of["meals","workouts","water","health"])for(const[k,v]of Object.entries(f.data[c]||{}))col[c][k]=v;
}

  if(!cfg||flushing)return;

  try{
    const[p,ch,ci,pt,nu]=await Promise.all([getFile("profile.json"),getFile("chat.json"),getRaw("checkins/latest.md").catch(()=>({text:null})),getFile("patterns.json").catch(()=>({data:{}})),getFile("inbox/nudge.json").catch(()=>({data:{}}))]);

function insights(){

  // protein by 5 PM
  const by5=core.map(d=>mealsOn(d).filter(m=>hm2min(m.time||"12:00")<=17*60).reduce((a,m)=>a+(+m.protein||0),0));
  const avg5=Math.round(by5.reduce((a,b)=>a+b,0)/by5.length),endP=Math.round(core.reduce((a,d)=>a+totals(d).protein,0)/core.length);

  const cand=Object.entries(byDow).filter(([,v])=>v.length>=2).map(([k,v])=>[+k,v.reduce((a,b)=>a+b,0)/v.length,v.length]).sort((a,b)=>a[1]-b[1]);
  if(cand.length>=3&&cand[0][1]<s.proteinMin)out.push({id:"pdow",text:`Protein is lowest on ${DOWN[cand[0][0]]}: ${Math.round(cand[0][1])} g on average over ${cand[0][2]} weeks.`,n:cand[0][2]});
  // late eating
  const late=core.filter(d=>mealsOn(d).some(isLate));
  if(late.length){const c={};late.forEach(d=>c[dow(d)]=(c[dow(d)]||0)+1);const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
    out.push({id:"late",text:`Food after ${fmtT(s.close)} on ${late.length} of ${core.length} non-flex nights${top[1]>=2?`, most often ${DOWN[+top[0]]} (${top[1]})`:""}.`,n:core.length})}

  // missed sessions by plan day
  const miss={},plan={};days.forEach(d=>{const x=sessionState(d);if(x.st==="rest")return;const k=x.p.title;plan[k]=(plan[k]||0)+1;if(x.st==="miss")miss[k]=(miss[k]||0)+1});

  sheetEl.addEventListener("click",e=>{if(e.target===sheetEl)closeSheet()});onBind&&onBind(sheetEl);const f=sheetEl.querySelector("input,select,textarea");f&&setTimeout(()=>f.focus({preventScroll:true}),50)}

  <div id="replyBar" class="replybar" hidden></div>
  <form class="composer" id="composer"><div id="photoTray" class="phototray" hidden></div><div id="coachStatus" class="cstatus" hidden></div><button type="button" class="btn ghost" data-act="photo" aria-label="Log from a photo or screenshot" style="padding:10px 12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><textarea id="chatIn" rows="1" placeholder="Message the Coach" aria-label="Message"></textarea><button type="button" class="micbtn" id="micBtn" aria-pressed="false" aria-label="Start voice conversation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="btn" id="chatSend" type="submit" hidden>Send</button></form></div>`;
}
function renderChat(){
  const el=$("#chatLog");if(!el)return;
  const cs=$("#checkinSlot");if(cs)cs.innerHTML=checkinCard(false);
  const kb=$("#knowsBody");if(kb){const s=S(),ab=s.about||s.profile,ns=notes();
    kb.innerHTML=`<div class="eyebrow" style="margin-top:12px">About me</div><p class="small" style="white-space:pre-wrap;margin:6px 0 0">${ab?esc(ab):'<span class="muted">Nothing yet. Add your story so the Coach knows you.</span>'}</p>
    <div class="eyebrow" style="margin-top:14px">Patterns it has spotted</div><ul class="small" style="margin:6px 0 0;padding-left:18px">${insights().concat(coachPatterns()).map(x=>`<li>${esc(x.text)}</li>`).join("")}</ul><p class="hint" style="margin:4px 0 0">Full list on the Trends tab.</p>
    <div class="eyebrow" style="margin-top:14px">Learned in chats</div>${ns.length?`<div class="list">${ns.map((n,i)=>`<div class="item" style="grid-template-columns:1fr auto;padding-block:8px"><span class="small">${esc(n.text)}</span><button type="button" class="btn sm ghost" data-act="forgetNote" data-i="${i}">Remove</button></div>`).join("")}</div>`:'<p class="small muted" style="margin:6px 0 0">When you mention lasting things (a goal, a food you avoid, an injury), the Coach saves them here.</p>'}
    <button type="button" class="btn sm line" data-act="settings" style="margin-top:12px">Edit About me</button>`}
  const qp=$("#qp");if(qp)qp.innerHTML=(S().quickPrompts||[]).map(x=>`<button type="button" data-sugg="${esc(x)}">${esc(x)}</button>`).join("");
  const turns=chatTurns||[];
  if(!turns.length&&!awaiting){el.innerHTML=`<div class="card"><h2>Ask about your day, or just tell me what you ate</h2><p class="sub">Try “two boiled eggs and GF toast at 8:30”, “drank a bottle of water”, or “did the 45 min upper body”. I'll log it and give you the numbers.</p></div>`;return}
  const base=Math.max(0,turns.length-40);
  el.innerHTML=turns.slice(-40).map((t,k)=>`<div class="mwrap ${t.role==="user"?"u":"a"}"><div class="msg ${t.role==="user"?"u":"a"}">${t.quote?`<div class="quote">${esc(t.quote)}</div>`:""}${t.react?`<span class="rxbadge">${t.react}</span>`:""}${md(t.content)}${(t.imgs||(t.img?[t.img]:[])).length?`<div class="thumbs">${(t.imgs||[t.img]).map(u=>`<img src="${u}" alt="Photo you sent">`).join("")}</div>`:""}${t.actions?.length?`<div class="acts">${t.actions.map(actChip).join("")}</div>`:""}</div><div class="mact"><button type="button" class="replybtn" data-act="replyTo" data-i="${base+k}" aria-label="Reply to this message">Reply</button>${t.role!=="user"?REACTS.map(e=>`<button type="button" class="rx${t.react===e?" on":""}" data-act="react" data-i="${base+k}" data-e="${e}" aria-label="React ${e}" aria-pressed="${t.react===e}">${e}</button>`).join(""):""}</div></div>`).join("")
    +(awaiting?`<div class="msg a think">Thinking…</div>`:"")
    +(turns.length?`<button type="button" class="btn sm ghost" data-act="clearChat" style="align-self:center">Clear conversation</button>`:"");
  const all=el.querySelectorAll(".msg");all.length&&all[all.length-1].scrollIntoView({block:"nearest"});
}
function actChip(a){if(typeof a==="string")return`<span>✓ ${esc(a)}</span>`;
  const m=a.meal&&col.meals[a.meal];if(!m)return`<span>✓ ${esc(a.text)}</span>`;
  const txt=`Logged ${m.name} · ${n0(m.kcal)} kcal, ${n0(m.protein)} g protein`;
  if(!m.est)return`<button type="button" class="actbtn ok" data-act="editMeal" data-id="${esc(a.meal)}">✓ ${esc(txt)}${m.adjusted?" · adjusted":""}</button>`;
  return`<button type="button" class="actbtn est" data-act="editMeal" data-id="${esc(a.meal)}"><span class="l1">✓ ${esc(txt)}</span><span class="l2">${m.est.conf==="low"?"Rough guess":"Estimated"}${m.est.note?": "+esc(m.est.note):""}</span><span class="l3">Tap to adjust ›</span></button>`}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function bindComposer(){
  const f=$("#composer"),ta=$("#chatIn");
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(140,ta.scrollHeight)+"px";syncSendMic()});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();f.requestSubmit()}});
  f.onsubmit=e=>{e.preventDefault();const v=ta.value.trim();if(staged.length){const fl=staged;staged=[];ta.value="";ta.style.height="auto";renderTray();syncSendMic();sendPhotos(fl,v);return}if(!v)return;ta.value="";ta.style.height="auto";syncSendMic();sendText(v)};
  renderTray();
  $("#micBtn").onclick=toggleVoice;updateMic();
  /* swipe a message left or right to reply to it */
  const log=$("#chatLog");let sw=null;
  log.addEventListener("touchstart",e=>{const w=e.target.closest(".mwrap");if(!w||e.touches.length>1)return;const t=e.touches[0];sw={w,x:t.clientX,y:t.clientY,dx:0,lock:null};w.style.transition="none"},{passive:true});
  log.addEventListener("touchmove",e=>{if(!sw)return;const t=e.touches[0];const dx=t.clientX-sw.x,dy=t.clientY-sw.y;
    if(!sw.lock){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3)sw.lock="h";else if(Math.abs(dy)>10)sw.lock="v"}
    if(sw.lock!=="h")return;e.preventDefault();
    sw.dx=Math.max(-90,Math.min(90,dx));const p=Math.min(1,Math.abs(sw.dx)/60);
    sw.w.style.transform=`translateX(${sw.dx}px)`;sw.w.style.setProperty("--sw",p);sw.w.classList.toggle("swr",sw.dx>0);sw.w.classList.toggle("swl",sw.dx<0)},{passive:false});
  const endSwipe=()=>{if(!sw)return;const {w,dx,lock}=sw;sw=null;w.style.transition="";w.style.transform="";w.style.setProperty("--sw",0);
    if(lock==="h"&&Math.abs(dx)>=60){const b=w.querySelector("[data-act=replyTo]");if(b)setReply(+b.dataset.i)}};
  log.addEventListener("touchend",endSwipe);log.addEventListener("touchcancel",endSwipe);
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const sg=e.target.closest("[data-sugg]");if(sg){sendText(sg.dataset.sugg);return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="addMeal")mealSheet();
  else if(a==="editMeal")mealSheet({id,...col.meals[id]});
  else if(a==="addWorkout")workoutSheet();
  else if(a==="editWorkout")workoutSheet({id,...col.workouts[id]});
  else if(a==="addWeight")weightSheet();
  else if(a==="waterHelp")waterHelpSheet();
  else if(a==="settings")settingsSheet();
  else if(a==="addSaved")savedSheet();
  else if(a==="editSaved")savedSheet({id,...col.saved[id]});
  else if(a==="logSaved"){const m=col.saved[id];b.disabled=true;await safe(store.add("meals",{name:m.name,kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,date,time:date===todayStr()?nowHM():"12:00",created:Date.now()}),"Logged "+m.name);b.disabled=false}
  else if(a==="moveSaved"){const sv=savedList();const i=sv.findIndex(x=>x.id===id),j=i+(+b.dataset.dir);if(j<0||j>=sv.length)return;
    const A=sv[i],B=sv[j];const{id:ia,...da}=A,{id:ib,...dbb}=B;const oa=i,ob=j;await safe(store.set("saved",ia,{...da,order:ob}));await safe(store.set("saved",ib,{...dbb,order:oa}));
    sv.forEach((x,k)=>{if(k!==i&&k!==j&&x.order!==k){const{id:ix,...dx}=x;store.set("saved",ix,{...dx,order:k}).catch(()=>{})}})}
  else if(a==="water"){const ml=+b.dataset.ml;const cur=waterOn(date);waterUndo.push({d:date,ml});await safe(store.set("water",date,{...(col.water[date]||{}),ml:cur+ml}))}
  else if(a==="waterUndo"){const u=waterUndo.pop();if(!u)return;await safe(store.set("water",u.d,{...(col.water[u.d]||{}),ml:Math.max(0,waterOn(u.d)-u.ml)}),"Undone")}
  else if(a==="skipImport"){needsImport=false;render()}
  else if(a==="photo"){closeSheet();const pi=$("#photoIn");pi.value="";pi.click()}
  else if(a==="replyTo"){setReply(+b.dataset.i)}
  else if(a==="react"){const t=chatTurns&&chatTurns[+b.dataset.i];if(t){t.react=t.react===b.dataset.e?undefined:b.dataset.e;if(!t.react)delete t.react;saveChatSoon();renderChat()}}
  else if(a==="cancelReply"){setReply(-1)}
  else if(a==="unstage"){staged.splice(+b.dataset.i,1);renderTray();syncSendMic();if(!staged.length){const ta=$("#chatIn");if(ta)ta.placeholder="Message the Coach"}}
  else if(a==="unstageAll"){staged=[];renderTray();syncSendMic();const ta=$("#chatIn");if(ta)ta.placeholder="Message the Coach"}
  else if(a==="flexWeek"){const st=S();const fn={...(st.flexNights||{})};fn[b.dataset.ws]=b.dataset.d;await safe(store.set("settings","main",{...(col.settings.main||{}),flexNights:fn}),DOW[dow(b.dataset.d)]+" is this weekend's flex night")}
  else if(a==="retrySync"){setSync("saving");flush()}
  else if(a==="retryLoad"){loadAll()}
  else if(a==="disconnect"){if(b.dataset.armed){try{localStorage.removeItem(CFG_KEY)}catch{};cfg=null;closeSheet();await endConv();COLS.forEach(c=>col[c]={});render()}else{b.dataset.armed="1";b.textContent="Tap again to disconnect"}}
  else if(a==="syncNow"){closeSheet();if(hasPending())flush();else{lastLoad=0;loadAll()}toast("Syncing")}
  else if(a==="travelDay"){const st=S();const tr={...(st.travel||{})};if(b.dataset.on==="1")tr[b.dataset.d]=true;else delete tr[b.dataset.d];await safe(store.set("settings","main",{...(col.settings.main||{}),travel:tr}),b.dataset.on==="1"?"Marked as a travel day":"Travel day removed")}
  else if(a==="travelNo"){const st=S();await safe(store.set("settings","main",{...(col.settings.main||{}),travelAsked:{...(st.travelAsked||{}),[b.dataset.d]:true}}))}
  else if(a==="saveUsual"){const u=usualCandidates().find(x=>x.key===b.dataset.k);if(u){const sv=savedList();await safe(store.add("saved",{name:u.name,desc:"",kcal:u.kcal,protein:u.protein,carbs:u.carbs,fat:u.fat,order:sv.length?Math.max(...sv.map(x=>x.order??0))+1:0}),"Saved as a usual")}}
  else if(a==="dismissUsual"){const st=S();await safe(store.set("settings","main",{...(col.settings.main||{}),usualDismissed:[...new Set([...(st.usualDismissed||[]),b.dataset.k])]}))}
  else if(a==="month"){reportMonth=b.dataset.m;render()}
  else if(a==="fullReport"){openReport(b.dataset.m)}
  else if(a==="week"){reportWeek=b.dataset.w;render()}
  else if(a==="healthHelp"){healthSheet()}
  else if(a==="dismissPattern"){const P={...(col.patterns.main||{})};P.dismissed=[...new Set([...(P.dismissed||[]),b.dataset.t])];await safe(store.set("patterns","main",P),"Removed. The check-in won't bring it back.")}
  else if(a==="forgetNote"){const list=notes().slice();list.splice(+b.dataset.i,1);await safe(store.set("settings","memory",{notes:list}),"Removed")}
  else if(a==="chatSize"){const v=+b.dataset.v;try{localStorage.setItem("tf-chat-fs",String(v))}catch{}document.documentElement.style.setProperty("--chat-fs",v+"px");document.querySelectorAll("[data-act=chatSize]").forEach(x=>{const on=+x.dataset.v===v;x.classList.toggle("ghost",!on);x.setAttribute("aria-pressed",String(on))})}
  else if(a==="clearChat"){if(b.dataset.armed){chatTurns=[];await saveChat();renderChat()}else{b.dataset.armed="1";b.textContent="Tap again to clear"}}
});
$("#prevDay").onclick=()=>{date=addDays(date,-1);render()};
$("#nextDay").onclick=()=>{date=addDays(date,1);render()};
$("#dateLabel").onclick=()=>{date=todayStr();render()};
$("#settingsBtn").onclick=settingsSheet;
let toastT;function toast(m){document.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}
const VIEWS=["today","food","train","trends","coach"];
let quickWater=null;{const m=location.hash.match(/^#water=(\d{2,4})$/);if(m){quickWater=+m[1];history.replaceState(null,"",location.pathname+location.search+"#today")}}
async function applyQuickWater(){if(!quickWater||!lastLoad)return;const ml=quickWater;quickWater=null;if(ml<50||ml>3000)return;const t=todayStr();waterUndo.push({d:t,ml});
  if(await safe(store.set("water",t,{...(col.water[t]||{}),ml:waterOn(t)+ml})))toast(`+${ml} ml water · ${n0(waterOn(t))} of ${n0(S().waterMl)} ml today`);render()}
function route(){{const m=location.hash.match(/^#water=(\d{2,4})$/);if(m){quickWater=+m[1];history.replaceState(null,"",location.pathname+location.search+"#today");applyQuickWater()}}
  const h=location.hash.slice(1);const nv=VIEWS.includes(h)?h:"today";if(nv!==view){view=nv;$("#main").innerHTML="";window.scrollTo(0,0)}render()}
window.addEventListener("hashchange",route);
let lastDay=todayStr();setInterval(()=>{const t=todayStr();if(t!==lastDay){if(date===lastDay)date=t;lastDay=t}if(view==="today"&&!sheetEl)render()},60000);

/* ---------- keyboard handling (phones) ---------- */
(function(){
  const isField=el=>el&&(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&!["checkbox","radio","file","button","submit"].includes(el.type))||el.tagName==="SELECT");
  const vv=window.visualViewport;
  function update(){
    const open=isField(document.activeElement)&&(!vv||window.innerHeight-vv.height>120||matchMedia("(pointer:coarse)").matches);
    document.body.classList.toggle("kb",!!open);
  }
  document.addEventListener("focusin",e=>{if(isField(e.target)){update();if(e.target.id==="chatIn")setTimeout(()=>e.target.scrollIntoView({block:"end"}),250)}});
  document.addEventListener("focusout",()=>setTimeout(update,80));
  vv&&vv.addEventListener("resize",update);
})();
/* ---------- boot ---------- */
const BUILD="2026-11-05e";
(async()=>{try{const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/const BUILD="([^"]+)"/);
  if(m&&m[1]!==BUILD){const u=new URL(location.href);if(u.searchParams.get("v")!==m[1]){u.searchParams.set("v",m[1]);location.replace(u.toString())}}}catch{}})();
if(cfg&&loadCache())reapplyPending();
route();setStatus();if(cfg)loadAll();
</script>
